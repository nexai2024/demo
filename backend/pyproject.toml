# AppShowcase API — Vercel deployment configuration.
#
# Deploy: create a Vercel project with Root Directory set to `backend`.
# Vercel reads the runtime dependencies from [project] below (same list as
# requirements.txt) and loads the app from the entrypoint in [tool.vercel].
# The previous 131-package dev freeze is kept in requirements-freeze.txt;
# it includes tools (black, mypy, jq, s5cmd, pandas, litellm) that the API
# never imports and that break or bloat a Vercel build.

[project]
name = "appshowcase-api"
version = "1.0.0"
description = "AppShowcase FastAPI backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.110.1",
    "pydantic==2.14.3",
    "email-validator==2.3.0",
    "python-dotenv==1.2.4",
    "PyJWT==2.15.1",
    "bcrypt==4.1.3",
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "Pillow==13.0.0",
    "imageio-ffmpeg==0.8.1",
    "boto3==1.43.125",
    "motor==3.7.1",
    "pymongo==4.18.2",
    "playwright==1.65.0",
    "uvicorn==0.25.0",
]

# Custom entrypoint: the app lives in server.py, not a standard package.
# "app:app" loads backend/app.py, which puts this directory on sys.path
# (server.py imports its sibling modules as top-level modules) and then
# re-exports server.app. See https://vercel.com/docs/functions/runtimes/python
[tool.vercel]
entrypoint = "app:app"
